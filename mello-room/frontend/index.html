<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mello Room</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bungee+Shade&family=Fredoka:wght@300..700&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
      rel="stylesheet"
    />
  </head>
  <body data-page="home">
    <main class="shell">
      <h1 id="home-h1">Mello-i-soffan</h1>

      <section class="card form-card">
        <h2>Visningsnamn</h2>
        <label class="field">
          <input id="displayName" type="text" placeholder="Ditt name" />
        </label>
      </section>

      <section class="card form-card">
        <h2>Hoppa in</h2>
        <div class="row">
          <button id="createRoomBtn" class="btn">Skapa Rum</button>
        </div>

        <div class="row join-row">
          <input
            id="joinCode"
            type="text"
            maxlength="6"
            placeholder="Rumskod"
          />
          <button id="joinRoomBtn" class="btn">Gå med i rum</button>
        </div>

        <p id="homeStatus" class="status"></p>
      </section>
    </main>

    <div
      id="createRoomModal"
      class="modal-backdrop hidden"
      role="dialog"
      aria-modal="true"
      aria-labelledby="createRoomTitle"
    >
      <section class="card modal-card">
        <h2 id="createRoomTitle">Name Your Bidrag</h2>
        <label class="field">
          <span>Antal bidrag</span>
          <select id="bidragCountSelect"></select>
        </label>
        <div id="entriesGrid" class="entries-grid"></div>
        <div class="row modal-actions">
          <button id="cancelCreateRoomBtn" class="btn" type="button">
            Avbryt
          </button>
          <button id="confirmCreateRoomBtn" class="btn" type="button">
            Spara & Skapa Rum
          </button>
        </div>
      </section>
    </div>

    <script src="api.js"></script>
    <script src="common.js"></script>
    <script src="home.js"></script>
  </body>
</html>
