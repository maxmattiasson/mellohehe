<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mello Room</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bungee+Shade&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Rubik+Doodle+Shadow&display=swap"
      rel="stylesheet"
    />
  </head>
  <body data-page="home">
    <main class="shell">
      <h1 id="home-h1">Mello-i-soffan</h1>

      <section class="card form-card">
        <h2>Visningsnamn</h2>
        <label class="field">
          <input id="displayName" type="text" placeholder="Your name" />
        </label>
      </section>

      <section class="card form-card">
        <h2>Hoppa in</h2>
        <div class="row">
          <button id="createRoomBtn" class="btn">Create Room</button>
        </div>

        <div class="row join-row">
          <input
            id="joinCode"
            type="text"
            maxlength="6"
            placeholder="Room code"
          />
          <button id="joinRoomBtn" class="btn">Join Room</button>
        </div>

        <p id="homeStatus" class="status"></p>
      </section>
    </main>

    <div
      id="createRoomModal"
      class="modal-backdrop hidden"
      role="dialog"
      aria-modal="true"
      aria-labelledby="createRoomTitle"
    >
      <section class="card modal-card">
        <h2 id="createRoomTitle">Name Your Bidrag</h2>
        <label class="field">
          <span>Antal bidrag</span>
          <select id="bidragCountSelect"></select>
        </label>
        <div id="entriesGrid" class="entries-grid"></div>
        <div class="row modal-actions">
          <button id="cancelCreateRoomBtn" class="btn" type="button">
            Cancel
          </button>
          <button id="confirmCreateRoomBtn" class="btn" type="button">
            Save & Create Room
          </button>
        </div>
      </section>
    </div>

    <script src="api.js"></script>
    <script src="common.js"></script>
    <script src="home.js"></script>
  </body>
</html>
