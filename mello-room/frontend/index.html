<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mello Room</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-page="home">
    <main class="shell">
      <h1>Mello-i-soffan</h1>

      <section class="card form-card">
        <h2>Visningsnamn</h2>
        <label class="field">
          <input id="displayName" type="text" placeholder="Your name" />
        </label>
      </section>

      <section class="card form-card">
        <h2>Hoppa in</h2>
        <div class="row">
          <button id="createRoomBtn" class="btn">Create Room</button>
        </div>

        <div class="row join-row">
          <input
            id="joinCode"
            type="text"
            maxlength="6"
            placeholder="Room code"
          />
          <button id="joinRoomBtn" class="btn">Join Room</button>
        </div>

        <p id="homeStatus" class="status"></p>
      </section>
    </main>

    <script src="api.js"></script>
    <script src="common.js"></script>
    <script src="home.js"></script>
  </body>
</html>
