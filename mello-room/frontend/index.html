<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mello Room</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-page="home">
    <main class="shell">
      <h1>Mello Room</h1>

      <section class="card form-card">
        <h2>Identity</h2>
        <label class="field">
          <span>Display Name</span>
          <input id="displayName" type="text" placeholder="Your name" />
        </label>

        <label class="field">
          <span>Auth User ID (optional)</span>
          <input id="authUserId" type="text" placeholder="e.g. user_123" />
        </label>

        <label class="field">
          <span>Host User ID (for create)</span>
          <input id="hostUserId" type="text" placeholder="Required to create room" />
        </label>

        <p class="muted" id="identitySummary"></p>
      </section>

      <section class="card form-card">
        <h2>Room Actions</h2>
        <div class="row">
          <button id="createRoomBtn" class="btn">Create Room</button>
        </div>

        <div class="row join-row">
          <input id="joinCode" type="text" maxlength="6" placeholder="Room code" />
          <button id="joinRoomBtn" class="btn">Join Room</button>
        </div>

        <p id="homeStatus" class="status"></p>
      </section>
    </main>

    <script src="api.js"></script>
    <script src="main.js"></script>
  </body>
</html>
