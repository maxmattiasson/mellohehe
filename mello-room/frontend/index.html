<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mello</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bungee+Shade&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Rubik+Doodle+Shadow&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="app">
      <h1>Mello-i-soffan</h1>
      <section class="user-panel">
        <label for="username">Användarnamn</label>
        <input
          id="username"
          type="text"
          placeholder="Skriv ditt namn"
          autocomplete="name"
        />
      </section>
      <section class="cont" id="bidrag-list"></section>
      <section class="ranking-panel">
        <h2>Ranking</h2>
        <ol id="ranking-list"></ol>
      </section>
    </main>
    <script src="main.js"></script>
  </body>
</html>
