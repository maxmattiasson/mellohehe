<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mello Lobby</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bungee+Shade&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Rubik+Doodle+Shadow&display=swap"
      rel="stylesheet"
    />
  </head>
  <body data-page="lobby">
    <main class="shell">
      <header class="card page-head">
        <h1>Lobby</h1>
        <p id="lobbyMeta" class="muted"></p>
        <div class="row">
          <a id="lobbyToVote" class="btn btn-link" href="#">Back to Vote</a>
          <a id="lobbyToResults" class="btn btn-link" href="#">Live Results</a>
          <a class="btn btn-link" href="/">Home</a>
        </div>
      </header>

      <section class="grid lobby-grid">
        <article class="card lobby-panel">
          <h2>Participants</h2>
          <p class="muted">Everyone who has joined this room.</p>
          <p id="lobbyStatus" class="status"></p>
          <ul id="participantsList" class="participants-list"></ul>
        </article>

        <article class="card lobby-panel">
          <h2 id="peekTitle">Saved Votes</h2>
          <div id="peekContent"></div>
        </article>
      </section>
    </main>
    <script src="api.js"></script>
    <script src="common.js"></script>
    <script src="lobby.js"></script>
  </body>
</html>
