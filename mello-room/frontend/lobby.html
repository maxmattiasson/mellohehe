<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mello Lobby</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bungee+Shade&family=Fredoka:wght@300..700&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
      rel="stylesheet"
    />
  </head>
  <body data-page="lobby">
    <main class="shell">
      <header class="card page-head">
        <h1>Lobby</h1>
        <p id="lobbyMeta" class="muted"></p>
        <div class="row">
          <a id="lobbyToVote" class="btn btn-link" href="#">Rösta</a>
          <a id="lobbyToResults" class="btn btn-link" href="#">Resultat</a>
          <a class="btn btn-link" href="/">Lämna</a>
        </div>
      </header>

      <section class="grid lobby-grid">
        <article class="card lobby-panel">
          <h2>Deltagare</h2>
          <p class="muted">Inne i värmen</p>
          <p id="lobbyStatus" class="status"></p>
          <ul id="participantsList" class="participants-list"></ul>
        </article>

        <article class="card lobby-panel">
          <h2 id="peekTitle">Sparade Röster</h2>
          <div id="peekContent"></div>
        </article>
      </section>
    </main>
    <script src="api.js"></script>
    <script src="common.js"></script>
    <script src="lobby.js"></script>
  </body>
</html>
