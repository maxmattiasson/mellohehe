<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mello Results</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bungee+Shade&family=Fredoka:wght@300..700&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
      rel="stylesheet"
    />
  </head>
  <body data-page="results">
    <main class="shell">
      <header class="card page-head">
        <h1>Live Resultat</h1>
        <p id="resultsMeta" class="muted"></p>
        <div class="row">
          <a id="backToVote" class="btn btn-link" href="#">Rösta</a>
          <a id="goToLobby" class="btn btn-link" href="#">Lobby</a>
          <a class="btn btn-link" href="/">Lämna</a>
        </div>
      </header>

      <section class="stack" id="resultsList"></section>
    </main>

    <script src="api.js"></script>
    <script src="common.js"></script>
    <script src="results.js"></script>
  </body>
</html>
