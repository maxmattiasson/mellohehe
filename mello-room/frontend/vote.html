<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mello Vote</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bungee+Shade&family=Fredoka:wght@300..700&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
      rel="stylesheet"
    />
  </head>
  <body data-page="vote">
    <main class="shell">
      <header class="card page-head">
        <h1>Röstning</h1>
        <p id="voteMeta" class="muted"></p>
        <div class="row">
          <a id="resultsLink" class="btn btn-link" href="#">Live Resultat</a>
          <a id="lobbyLink" class="btn btn-link" href="#">Lobby</a>
          <button id="saveVotesBtn" class="btn">Spara</button>
        </div>
        <p id="saveStatus" class="status"></p>
      </header>

      <section class="grid" id="voteGrid"></section>
    </main>

    <script src="api.js"></script>
    <script src="common.js"></script>
    <script src="vote.js"></script>
  </body>
</html>
